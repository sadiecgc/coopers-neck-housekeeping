<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>199 Coopers Neck Lane - Housekeeping Tracker</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; padding: 20px;
    }
    .container { max-width:1200px; margin:0 auto; background:white; border-radius:20px; box-shadow:0 20px 40px rgba(0,0,0,.1); overflow:hidden }
    .header { background:#2c3e50; color:white; padding:30px; text-align:center }
    .header h1 { font-size:2.5em; margin-bottom:10px; font-weight:700 }
    .header p { font-size:1.1em; opacity:.9 }
    .main-content { padding:30px }
    .view-selector { display:flex; gap:15px; margin-bottom:30px; justify-content:center; flex-wrap:wrap }
    .view-btn { padding:12px 24px; border:none; border-radius:50px; font-size:16px; font-weight:600; cursor:pointer; transition:.3s; background:#ecf0f1; color:#2c3e50 }
    .view-btn.active { background:#3498db; color:white; transform:translateY(-2px); box-shadow:0 5px 15px rgba(52,152,219,.3) }
    .form-section { background:#f8f9fa; padding:25px; border-radius:15px; margin-bottom:25px }
    .form-header { display:flex; gap:20px; margin-bottom:25px; flex-wrap:wrap }
    .form-group { flex:1; min-width:200px }
    .form-group label { display:block; margin-bottom:8px; font-weight:600; color:#2c3e50 }
    .form-group input, .form-group select { width:100%; padding:12px; border:2px solid #e9ecef; border-radius:8px; font-size:16px; transition:border-color .3s }
    .form-group input:focus, .form-group select:focus { outline:none; border-color:#3498db }
    .tasks-section { margin-top:25px }
    .shift-title { font-size:1.5em; color:#2c3e50; margin-bottom:20px; padding-bottom:10px; border-bottom:3px solid #3498db }
    .task-item { display:flex; align-items:center; padding:15px; margin-bottom:10px; background:white; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.05); transition:.3s }
    .task-item:hover { transform:translateX(5px); box-shadow:0 4px 15px rgba(0,0,0,.1) }
    .task-checkbox { width:20px; height:20px; margin-right:15px; cursor:pointer; transform:scale(1.2) }
    .task-text { flex:1; font-size:16px; line-height:1.4 }
    .submit-btn { background: linear-gradient(45deg,#27ae60,#2ecc71); color:white; border:none; padding:15px 40px; font-size:18px; font-weight:600; border-radius:50px; cursor:pointer; transition:.3s; display:block; margin:30px auto 0; min-width:200px }
    .submit-btn:hover { transform:translateY(-3px); box-shadow:0 10px 25px rgba(46,204,113,.3) }
    .submit-btn:disabled { background:#bdc3c7; cursor:not-allowed; transform:none; box-shadow:none }
    .success-message { background:#d4edda; color:#155724; padding:15px; border-radius:10px; margin-top:20px; text-align:center; font-weight:600 }
    .manager-view { display:none }
    .submissions-grid { display:grid; gap:20px; margin-top:20px }
    .submission-card { background:white; padding:20px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,.08); border-left:5px solid #3498db }
    .submission-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px }
    .submission-info { flex:1 }
    .submission-stats { background:#ecf0f1; padding:8px 16px; border-radius:20px; font-size:14px; font-weight:600 }
    .housekeeper-colors { margin-bottom:20px; padding:15px; background:#e8f4fd; border-radius:10px }
    .color-legend { display:flex; gap:20px; flex-wrap:wrap; justify-content:center }
    .color-item { display:flex; align-items:center; gap:8px }
    .color-dot { width:16px; height:16px; border-radius:50%; border:2px solid #333 }
    .export-btn { background:#e74c3c; color:white; border:none; padding:12px 24px; border-radius:8px; cursor:pointer; font-weight:600; margin:10px }
    .filter-section { margin-bottom:25px; padding:20px; background:#f8f9fa; border-radius:10px }
    .filter-row { display:flex; gap:15px; flex-wrap:wrap; align-items:end }
    .clear-btn { background:#95a5a6; color:white; border:none; padding:12px 20px; border-radius:8px; cursor:pointer; font-weight:600 }
    .sheet-link { margin-left:auto; text-decoration:none; font-weight:600; padding:10px 14px; border:2px solid #3498db; border-radius:10px }
    @media (max-width: 768px){
      .header h1{font-size:2em}
      .form-header{flex-direction:column}
      .view-selector{flex-direction:column; align-items:center}
      .filter-row{flex-direction:column; align-items:stretch}
      .submission-header{flex-direction:column; align-items:flex-start}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>199 Coopers Neck Lane</h1>
      <p>CHESTERMAN GROUP CORP - Housekeeping Task Tracker 2025</p>
    </div>

    <div class="main-content">
      <div class="view-selector">
        <button class="view-btn active" onclick="showView(event, 'housekeeper')">Housekeeper Form</button>
        <button class="view-btn" onclick="showView(event, 'manager')">Manager Dashboard</button>
      </div>

      <!-- Housekeeper View -->
      <div id="housekeeper-view" class="housekeeper-view">
        <div class="housekeeper-colors">
          <h3 style="text-align:center; margin-bottom:15px;">Housekeeper Colors</h3>
          <div class="color-legend">
            <div class="color-item"><div class="color-dot" style="background:#e74c3c;"></div><span>JACKY</span></div>
            <div class="color-item"><div class="color-dot" style="background:#2ecc71;"></div><span>KUNGA</span></div>
            <div class="color-item"><div class="color-dot" style="background:#3498db;"></div><span>LORENA</span></div>
            <div class="color-item"><div class="color-dot" style="background:#9b59b6;"></div><span>HEIDI</span></div>
            <div class="color-item"><div class="color-dot" style="background:#f39c12;"></div><span>ANA</span></div>
            <div class="color-item"><div class="color-dot" style="background:#ff1493;"></div><span>IRMA</span></div>
            <div class="color-item"><div class="color-dot" style="background:#34495e;"></div><span>AGNES</span></div>
            <div class="color-item"><div class="color-dot" style="background:#14B8A6;"></div><span>ANITA</span></div>
          </div>
        </div>

        <form id="taskForm" class="form-section">
          <div class="form-header">
            <div class="form-group">
              <label for="housekeeper">Housekeeper Name:</label>
              <select id="housekeeper" required>
                <option value="">Select Housekeeper</option>
                <option value="JACKY">JACKY</option>
                <option value="KUNGA">KUNGA</option>
                <option value="LORENA">LORENA</option>
                <option value="HEIDI">HEIDI</option>
                <option value="ANA">ANA</option>
                <option value="IRMA">IRMA</option>
                <option value="AGNES">AGNES</option>
                <option value="ANITA">ANITA</option>
              </select>
            </div>
            <div class="form-group">
              <label for="shift">Shift:</label>
              <select id="shift" required onchange="loadTasks()">
                <option value="">Select Shift</option>
                <option value="morning">Morning - 7:30am</option>
                <option value="middle">Middle - 10:30/11:00am</option>
                <option value="evening">Evening - 12:00pm</option>
              </select>
            </div>
            <div class="form-group">
              <label for="date">Date:</label>
              <input type="date" id="date" required>
            </div>
          </div>

          <div id="tasks-container" class="tasks-section">
            <p style="text-align:center; color:#7f8c8d; font-style:italic;">Please select a shift to see the tasks</p>
          </div>

          <button type="submit" class="submit-btn" disabled>Submit Daily Tasks</button>

          <div id="success-message" class="success-message" style="display:none;">
            Tasks submitted successfully! ✅
          </div>
        </form>
      </div>

      <!-- Manager View -->
      <div id="manager-view" class="manager-view">
        <div class="filter-section">
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:10px;">
            <h3 style="margin-bottom: 15px;">Filter Submissions</h3>
            <a id="sheetLink" class="sheet-link" href="#" target="_blank" rel="noopener">Open in Google Sheets</a>
          </div>
          <div class="filter-row">
            <div class="form-group">
              <label for="filterHousekeeper">Housekeeper:</label>
              <select id="filterHousekeeper" onchange="filterSubmissions()">
                <option value="">All Housekeepers</option>
                <option value="JACKY">JACKY</option>
                <option value="KUNGA">KUNGA</option>
                <option value="LORENA">LORENA</option>
                <option value="HEIDI">HEIDI</option>
                <option value="ANA">ANA</option>
                <option value="IRMA">IRMA</option>
                <option value="AGNES">AGNES</option>
                 <option value="ANITA">ANITA</option>
              </select>
            </div>
            <div class="form-group">
              <label for="filterShift">Shift:</label>
              <select id="filterShift" onchange="filterSubmissions()">
                <option value="">All Shifts</option>
                <option value="morning">Morning</option>
                <option value="middle">Middle</option>
                <option value="evening">Evening</option>
              </select>
            </div>
            <div class="form-group">
              <label for="filterDate">Date:</label>
              <input type="date" id="filterDate" onchange="filterSubmissions()">
            </div>
            <button class="clear-btn" onclick="clearFilters()">Clear Filters</button>
            <button class="export-btn" onclick="exportData()">Export All Data</button>
          </div>
        </div>
        <div id="submissions-container" class="submissions-grid">
          <p style="text-align:center; color:#7f8c8d; font-style:italic;">No submissions yet</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ====== CONFIG: put your real Google Sheet URL below (optional convenience link) ======
    const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1u_4juhGxNlaJLQcZhxKq169XMf1WaCuJRjF02o4cC6I/edit#gid=0";
    // =====================================================================================

    // Task definitions for each shift
    const shiftTasks = {
      morning: [
        "Turn lights on (or off exteriors)",
        "Check Ms. Jen's Office (change water)",
        "Set the table for kids' breakfast",
        "Empty dishwashers",
        "Walk the dogs then feed them",
        "Set up pool area; towels & open umbrellas",
        "Remove outdoor furniture covers (put covers on in rain)",
        "Ensure all outdoor furniture is spotless and tidy",
        "Charge TV remotes once every two weeks",
        "Check dining room from night prior",
        "Quiet walk through the house to tidy as necessary",
        "Add water to or change flowers as needed (2 person job)",
        "Assist with family breakfast and any additional needs",
        "Clean up after breakfast",
        "Receive and display packages",
        "Check bathrooms on ground floor",
        "Clean Oli's room & bathroom",
        "Clean Frankie's room & bathroom",
        "Clean Sonnet's room if available; if not tell evening shift",
        "Collect laundry & bring to laundry room",
        "Clean Master if available; if not tell middle shift",
        "Clean playroom & restock fridge/coffee in hallway",
        "Clean Jen's outdoor shed"
      ],
      middle: [
        "Set up kitchen for kids lunch (clean after)",
        "Assist with cleaning Master or any rooms need attention",
        "Assist with any packages or deliveries",
        "Clean Master level hallway",
        "Clean guest 1A next to kitchen",
        "Clean guest 2A near lounge",
        "Clean guest 2B next to Mr. Stewart's office",
        "Clean guest 3A next to laundry room",
        "Clean playroom if available",
        "Clean guest 3B next to playroom",
        "Clean 2nd floor hallway",
        "Clean guest apartment; sweep garage",
        "Clean lounge area",
        "Clean gym/spa room",
        "Assist with family lunch",
        "Clean Mr. Stewart's office",
        "Collect kitchen garbage",
        "Sweep outside & clean garden if needed",
        "Walk the dogs",
        "Clean bathrooms on the ground floor",
        "Help put away laundry when ready",
        "Change water for dogs",
        "Clean fingers prints from all surfaces; clear cobwebs"
      ],
      evening: [
        "Ensure lights are on evening setting around 5:30/6pm",
        "Clean 1st floor hallway",
        "Clean library",
        "Clean dining room",
        "Clean bar area and refill as needed",
        "Clean pantry and stairways by kitchen",
        "Make sure front door entrance is clean",
        "Turn down, clean & refresh all bathrooms",
        "Check pool area & cabana to replace towels/organize",
        "Clean tennis area and backyard",
        "Clean kitchen, pantry and receiving room for the day",
        "Clean family areas and bathrooms",
        "Turn down the kids' rooms after nap (usually after 4pm)",
        "Set dinner table for kids",
        "Assist with family dinner",
        "Feed dogs and then walk them; ensure bowls are clean",
        "Collect kitchen garbage",
        "Bring clean laundry to the rooms",
        "Refill fridge and ensure drinks are fully stocked",
        "Dispose of all garbage (check cal for trash days)",
        "Turn lights to appropriate settings before leaving",
        "Check laundry room to ensure nothing is left",
        "Close Jen's shed door, turn off lights, fan and the sewing machine"
      ]
    };

    // In-memory cache for current page; real storage happens in Google Sheets
    let submissions = [];

    // Default date
    (function setDefaultDate(){
      const dateEl = document.getElementById('date');
      if (dateEl) dateEl.valueAsDate = new Date();
    })();

    function showView(ev, view) {
      document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
      if (ev && ev.target) ev.target.classList.add('active');

      if (view === 'housekeeper') {
        document.getElementById('housekeeper-view').style.display = 'block';
        document.getElementById('manager-view').style.display = 'none';
      } else {
        document.getElementById('housekeeper-view').style.display = 'none';
        document.getElementById('manager-view').style.display = 'block';
        document.getElementById('sheetLink').href = GOOGLE_SHEET_URL;
        loadSubmissionsFromServer().then(displaySubmissions);
      }
    }

    function loadTasks() {
      const shift = document.getElementById('shift').value;
      const container = document.getElementById('tasks-container');
      const submitBtn = document.querySelector('.submit-btn');

      if (!shift) {
        container.innerHTML = '<p style="text-align:center; color:#7f8c8d; font-style:italic;">Please select a shift to see the tasks</p>';
        submitBtn.disabled = true; return;
      }

      const tasks = shiftTasks[shift];
      const shiftNames = { morning:'MORNING SHIFT', middle:'MIDDLE SHIFT', evening:'EVENING SHIFT' };
      let html = `<h3 class="shift-title">${shiftNames[shift]}</h3>`;
      tasks.forEach((task, i) => {
        html += `<div class="task-item">
          <input type="checkbox" class="task-checkbox" id="task-${i}" name="tasks" value="${task}">
          <label for="task-${i}" class="task-text">${task}</label>
        </div>`;
      });
      container.innerHTML = html;
      submitBtn.disabled = false;
    }

    document.getElementById('taskForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const housekeeper = document.getElementById('housekeeper').value;
      const shift = document.getElementById('shift').value;
      const date = document.getElementById('date').value;
      const checkboxes = document.querySelectorAll('input[name="tasks"]:checked');

      if (!housekeeper || !shift || !date) {
        alert('Please fill in all required fields'); return;
      }

      const completedTasks = Array.from(checkboxes).map(cb => cb.value);
      const totalTasks = shiftTasks[shift].length;
      const incompleteTasks = shiftTasks[shift].filter(t => !completedTasks.includes(t));
      const completionRate = Math.round((completedTasks.length / totalTasks) * 100);
      const payload = {
        date,
        housekeeper,
        shift,
        completedTasks,
        totalTasks,
        completionRate,
        submittedAt: new Date().toISOString(),
        incompleteTasks
      };

      try {
        const res = await fetch('/.netlify/functions/submissions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || res.statusText);

        // Update local cache for immediate Manager view
        submissions.push({
          date,
          housekeeper,
          shift,
          completedTasks,
          totalTasks,
          completionRate,
          submittedAt: payload.submittedAt,
          incompleteTasks
        });

        // Success UX
        document.getElementById('success-message').style.display = 'block';
        setTimeout(() => { document.getElementById('success-message').style.display = 'none'; }, 3000);

        // Reset
        this.reset();
        document.getElementById('date').valueAsDate = new Date();
        document.getElementById('tasks-container').innerHTML =
          '<p style="text-align:center; color:#7f8c8d; font-style:italic;">Please select a shift to see the tasks</p>';
        document.querySelector('.submit-btn').disabled = true;
      } catch (err) {
        alert('Error saving submission: ' + err.message);
      }
    });

    async function loadSubmissionsFromServer(){
      try {
        const res = await fetch('/.netlify/functions/submissions');
        const data = await res.json();
        const rows = data.submissions || [];
        submissions = rows.map(s => {
          const incompleteTasks = s.incompleteList ? s.incompleteList.split('; ').filter(Boolean) : [];
          const completedCount = s.completedCount != null ? Number(s.completedCount) : (Number(s.totalTasks || 0) - incompleteTasks.length);
          const completionRate = s.completionRate ? Number(s.completionRate) : Math.round( (completedCount / (Number(s.totalTasks)||1)) * 100 );
          return {
            housekeeper: s.housekeeper,
            shift: s.shift,
            date: s.date,
            completedTasks: new Array(completedCount).fill(null), // length only for display count
            totalTasks: Number(s.totalTasks || 0),
            completionRate,
            submittedAt: s.submittedAt,
            incompleteTasks
          };
        });
      } catch (e) {
        console.error('Failed to load submissions', e);
      }
    }

    function displaySubmissions() {
      const container = document.getElementById('submissions-container');
      if (!submissions.length) {
        container.innerHTML = '<p style="text-align:center; color:#7f8c8d; font-style:italic;">No submissions yet</p>';
        return;
      }
      const sorted = submissions.slice().sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));
      let html = '';
      sorted.forEach(sub => {
        const completionColor = sub.completionRate >= 90 ? '#27ae60' : sub.completionRate >= 70 ? '#f39c12' : '#e74c3c';
        const completedCount = sub.completedTasks.length;
        html += `<div class="submission-card">
          <div class="submission-header">
            <div class="submission-info">
              <h4>${sub.housekeeper} - ${sub.shift.toUpperCase()} SHIFT</h4>
              <p>Date: ${new Date(sub.date).toLocaleDateString()}</p>
              <p>Submitted: ${new Date(sub.submittedAt).toLocaleString()}</p>
            </div>
            <div class="submission-stats" style="background-color:${completionColor}; color:white;">
              ${completedCount}/${sub.totalTasks} tasks (${sub.completionRate}%)
            </div>
          </div>
          <details>
            <summary style="cursor:pointer; font-weight:600; margin-bottom:10px;">View Incomplete Tasks</summary>
            <ul style="margin-left:20px;">
              ${sub.incompleteTasks.map(task => `<li style="margin-bottom:5px; color:#e74c3c;">❌ ${task}</li>`).join('') || '<li>None 🎉</li>'}
            </ul>
          </details>
        </div>`;
      });
      container.innerHTML = html;
    }

    function filterSubmissions() {
      const housekeeperFilter = document.getElementById('filterHousekeeper').value;
      const shiftFilter = document.getElementById('filterShift').value;
      const dateFilter = document.getElementById('filterDate').value;

      let filtered = submissions.slice();
      if (housekeeperFilter) filtered = filtered.filter(sub => sub.housekeeper === housekeeperFilter);
      if (shiftFilter) filtered = filtered.filter(sub => sub.shift === shiftFilter);
      if (dateFilter) filtered = filtered.filter(sub => sub.date === dateFilter);

      displayFilteredSubmissions(filtered);
    }

    function displayFilteredSubmissions(list) {
      const container = document.getElementById('submissions-container');
      if (!list.length) {
        container.innerHTML = '<p style="text-align:center; color:#7f8c8d; font-style:italic;">No submissions match the selected filters</p>';
        return;
      }
      const sorted = list.slice().sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));
      let html = '';
      sorted.forEach(sub => {
        const completionColor = sub.completionRate >= 90 ? '#27ae60' : sub.completionRate >= 70 ? '#f39c12' : '#e74c3c';
        const completedCount = sub.completedTasks.length;
        html += `<div class="submission-card">
          <div class="submission-header">
            <div class="submission-info">
              <h4>${sub.housekeeper} - ${sub.shift.toUpperCase()} SHIFT</h4>
              <p>Date: ${new Date(sub.date).toLocaleDateString()}</p>
              <p>Submitted: ${new Date(sub.submittedAt).toLocaleString()}</p>
            </div>
            <div class="submission-stats" style="background-color:${completionColor}; color:white;">
              ${completedCount}/${sub.totalTasks} tasks (${sub.completionRate}%)
            </div>
          </div>
          <details>
            <summary style="cursor:pointer; font-weight:600; margin-bottom:10px;">View Incomplete Tasks</summary>
            <ul style="margin-left:20px;">
              ${sub.incompleteTasks.map(task => `<li style="margin-bottom:5px; color:#e74c3c;">❌ ${task}</li>`).join('') || '<li>None 🎉</li>'}
            </ul>
          </details>
        </div>`;
      });
      container.innerHTML = html;
    }

    async function exportData() {
      await loadSubmissionsFromServer();
      if (!submissions.length) { alert('No data to export'); return; }

      let csv = 'Date,Housekeeper,Shift,Completed Tasks,Total Tasks,Completion Rate,Submitted At,Incomplete Task List\n';
      submissions.forEach(sub => {
        csv += `"${sub.date}","${sub.housekeeper}","${sub.shift}","${sub.completedTasks.length}","${sub.totalTasks}","${sub.completionRate}%","${new Date(sub.submittedAt).toLocaleString()}","${sub.incompleteTasks.join('; ')}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `housekeeping-tasks-${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
